[monsters]
	#Overall multiplier of the formula's rate variable; 0 disables rate-based growth in the default formula. Custom formulas may also use day or days directly. Existing monsters refresh periodically.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	growth_multiplier = 1.0
	#Daily health growth multiplier, multiplied by the overall growth multiplier.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	health_growth_multiplier = 1.0
	#Daily attack damage growth multiplier, multiplied by the overall growth multiplier.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	damage_growth_multiplier = 1.0
	#Initial unscaled maximum health. 0 preserves each entity's native health, including independent modifiers.
	# Default: 0.0
	# Range: 0.0 ~ 1024.0
	health_base = 0.0
	#Initial innate melee attack damage. 0 preserves each entity's native base; weapon bonuses are added afterward.
	# Default: 0.0
	# Range: 0.0 ~ 2048.0
	damage_base = 0.0
	#Minimum initial health growth reference for skeletons. After each blood moon the actual settled value becomes the new reference.
	# Default: 20.0
	# Range: 0.0 ~ 1024.0
	skeleton_reference = 20.0
	#Daily health growth in percent of the current blood-moon baseline: 0.5 means 0.5%, or rate=0.005 in the formula.
	# Default: 0.5
	# Range: 0.0 ~ 100.0
	health_daily_percent = 0.5
	#Daily innate attack growth in percent of the current blood-moon baseline; 0.25 means rate=0.0025.
	# Default: 0.25
	# Range: 0.0 ~ 100.0
	damage_daily_percent = 0.25
	#Health within the current growth period. Variables: base, initial, reference, rate, days, day, blood_moons. The separate health_blood_moon_formula settles the new base/reference when a blood moon ends. Only validated arithmetic is accepted.
	health_formula = "base + reference * rate * days"
	#Innate attack within the current growth period. The separate damage_blood_moon_formula settles the next period's base/reference. Saved and reloaded formulas are validated before publication.
	damage_formula = "base + reference * rate * days"
	#Health baseline settlement when each blood moon ends (after days 32/64/96/160). The result becomes both base and reference for the next growth period; blue moons are skipped. Uses the same variables as health_formula. Empty inherits health_formula, preserving existing custom configurations.
	health_blood_moon_formula = "base + reference * rate * days"
	#Innate attack baseline settlement when each blood moon ends. The result becomes both base and reference for the next growth period; blue moons are skipped. Empty inherits damage_formula, preserving existing custom configurations.
	damage_blood_moon_formula = "base + reference * rate * days"

[monster_spawning]
	#Natural spawn weight overrides: namespace:entity=multiplier (0..100). 1 preserves the original weight; 0 disables natural spawning of that entity. Unknown IDs are retained. Existing biome, date, depth, population and spawn rules still apply. ITE-owned entities use the ITE configuration instead.
	rates = []
	#Absolute natural pool weight overrides: namespace:entity=integer (0..1000000). Omitted IDs retain each pool's original weight; overrides replace the weight in every existing candidate pool, before rate multipliers. 0 removes that candidate family, including its conversion branches. Does not add spawn entries or bypass date, biome, dimension or population rules. ITE-owned entities use ITE settings.
	weights = ["minecraft:ghast=5"]
	#reference_rules=1 (default) restores R196 natural caps, crowd guards and timing; 0 enables the saved custom controls. Reference mode retains but ignores custom numbers. Custom caps are per 289 chunks; day 1 has no daily increase; maximum_cap=0 means unlimited growth. Interval is in ticks (20 ticks/second); chances are percentages. ITE can supply its own preset.
	# Default: 1
	# Range: 0 ~ 1
	reference_rules = 1
	#reference_rules=1 (default) restores R196 natural caps, crowd guards and timing; 0 enables the saved custom controls. Reference mode retains but ignores custom numbers. Custom caps are per 289 chunks; day 1 has no daily increase; maximum_cap=0 means unlimited growth. Interval is in ticks (20 ticks/second); chances are percentages. ITE can supply its own preset.
	# Default: 105
	# Range: 0 ~ 100000
	base_cap = 100
	#reference_rules=1 (default) restores R196 natural caps, crowd guards and timing; 0 enables the saved custom controls. Reference mode retains but ignores custom numbers. Custom caps are per 289 chunks; day 1 has no daily increase; maximum_cap=0 means unlimited growth. Interval is in ticks (20 ticks/second); chances are percentages. ITE can supply its own preset.
	# Default: 140
	# Range: 0 ~ 100000
	blood_cap = 200
	#reference_rules=1 (default) restores R196 natural caps, crowd guards and timing; 0 enables the saved custom controls. Reference mode retains but ignores custom numbers. Custom caps are per 289 chunks; day 1 has no daily increase; maximum_cap=0 means unlimited growth. Interval is in ticks (20 ticks/second); chances are percentages. ITE can supply its own preset.
	# Default: 0.0

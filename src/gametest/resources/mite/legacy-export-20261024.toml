[combat]
	#Survival melee attack reach multiplier. Original MITE weapons keep source reach; Simply Swords weapons use their own Better Combat base range. Creative reach remains unchanged.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	weapon_reach_multiplier = 1.0
	#Subtract this many blocks after multiplying survival melee reach. Minimum resulting reach is 0.
	# Default: 0.0
	# Range: 0.0 ~ 16.0
	weapon_reach_reduction = 0.0
	#Apply MITE target-height reach adjustments.
	height_reach_penalty = true
	#Enable Better Combat weapon attacks and animations for hostile mobs when Better Combat is installed. False preserves their original attacks. Does not affect player compatibility.
	better_combat_mobs = false

[structures]
	#Allow new underworld trial dungeons. Existing structures are retained.
	underworld_trials = true
	#Allow new overworld trial chambers. Existing structures are retained.
	overworld_trials = true

[enchantments]
	#Disabled enchantment registry IDs. The registry browser fills these automatically. Existing item data is retained, but disabled effects and new acquisition are blocked.
	disabled = ["minecraft:binding_curse", "minecraft:loyalty"]
	#Only explicit overrides: namespace:enchantment=maximum (1..255). Omitted IDs retain their original rules. Unknown IDs are retained for temporarily removed mods.
	max_levels = ["modern_ite:extend=1"]
	#Random enchanting candidate admission chance: namespace:enchantment=percent (0..100). Omitted IDs and 100 retain vanilla selection; 0 excludes the enchantment from random enchanting. This does not change existing enchantments, anvil application, or commands. Unknown IDs are retained for temporarily removed mods.
	chance_percent = ["minecraft:loyalty=0.0"]

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
    exclude '**/*.bbmodel'
}

// Runtime integration tests are loaded in development runs, never in the mod JAR.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest

    runs {
        client {
            client()
            if (project.providers.gradleProperty('miteClientDirectory').isPresent()) {
                gameDirectory = file(project.providers.gradleProperty('miteClientDirectory').get())
            }
            if (project.providers.gradleProperty('miteSimplySwordsClientAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.simplySwordsClientAudit', 'true'
                systemProperty 'mite.simplySwordsClientAuditOutput', file(project.providers.gradleProperty('miteSimplySwordsClientAuditOutput')
                        .getOrElse('build/verification/simplyswords-client-audit.json')).absolutePath
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.providers.gradleProperty('miteTestWorld').isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', project.providers.gradleProperty('miteTestWorld').get()
            }
            // Opt-in client integration checks live only in the gametest source set.
            if (project.providers.gradleProperty('miteMiningSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.miningSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteMiningBaseSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.miningBaseSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteMiningHungerSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.miningHungerSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteFlintStartSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.flintStartSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteLogHarvestSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.logHarvestSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteWoodenEquipmentSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.woodenEquipmentSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteGrassMiningSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.grassMiningSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteFlintWorkbenchSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.flintWorkbenchSmoke', 'true'
            }
            if (project.providers.gradleProperty('miteMaterialSmoke').getOrElse('false').toBoolean()) {
                systemProperty 'mite.materialSmoke', 'true'
            }
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            if (project.providers.gradleProperty('miteGameTestDirectory').isPresent()) {
                gameDirectory = file(project.providers.gradleProperty('miteGameTestDirectory').get())
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.providers.gradleProperty('miteGameTestNamespaces').getOrElse('mite,mite_simplyswords')
        }
        data {
            data()
            if (project.providers.gradleProperty('miteShieldAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.shieldClientAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.shieldClientAuditOutput', file('build/verification/shield-client-audit.json').absolutePath
            }
            boolean skeletonWeaponDisplayAudit = project.providers.gradleProperty('miteSkeletonWeaponDisplayAudit').getOrElse('false').toBoolean()
            if (skeletonWeaponDisplayAudit) {
                systemProperty 'mite.skeletonWeaponDisplayAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.skeletonWeaponDisplayAuditOutput', file('build/verification/skeleton-weapon-display-client-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteAdvancementsTitleAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.advancementsTitleAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.advancementsTitleAuditOutput', file('build/verification/advancements-title-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteBucketPlacementAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.bucketPlacementClientAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.bucketPlacementClientAuditOutput', file('build/verification/bucket-client-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteWitchCurseAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.witchCurseAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.witchCurseAuditOutput', file('build/verification/witch-curse-client-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteDifficultyClientAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.difficultyClientAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.difficultyClientAuditOutput', file('build/verification/difficulty-client-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteCropJadeAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.cropJadeAudit', 'true'
                systemProperty 'mite.cropJadeAuditOutput', file('build/verification/crop-jade-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteEnchantmentAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.enchantmentClientAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.enchantmentClientAuditOutput', file('build/verification/enchantment-client-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteLunarVisualAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.lunarVisualAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.lunarVisualAuditOutput', file('build/verification/lunar-visual-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteDataDirectory').isPresent()) {
                gameDirectory = file(project.providers.gradleProperty('miteDataDirectory').get())
            }
            if (project.providers.gradleProperty('miteClientSettingsAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.clientSettingsAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                boolean noSettingsAuditMods = project.providers.gradleProperty('miteClientSettingsAuditNoMods').getOrElse('false').toBoolean()
                if (noSettingsAuditMods) gameDirectory = file('build/verification/client-settings-no-mods-run')
                systemProperty 'mite.clientSettingsAuditOutput', file(noSettingsAuditMods
                        ? 'build/verification/client-settings-audit-absent.json'
                        : 'build/verification/client-settings-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteMinimalDebugAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.minimalDebugAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                boolean noDebugAuditMods = project.providers.gradleProperty('miteMinimalDebugAuditNoMods').getOrElse('false').toBoolean()
                if (noDebugAuditMods) gameDirectory = file('build/verification/minimal-debug-no-mods-run')
                systemProperty 'mite.minimalDebugAuditOutput', file(noDebugAuditMods
                        ? 'build/verification/minimal-debug-audit-absent.json'
                        : 'build/verification/minimal-debug-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteAutoHarvestInputAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.autoHarvestInputAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                boolean noAutoHarvestAuditMods = project.providers.gradleProperty('miteAutoHarvestInputAuditNoMods').getOrElse('false').toBoolean()
                if (noAutoHarvestAuditMods) gameDirectory = file('build/verification/auto-harvest-no-mods-run')
                systemProperty 'mite.autoHarvestInputAuditOutput', file(noAutoHarvestAuditMods
                        ? 'build/verification/auto-harvest-input-audit-absent.json'
                        : 'build/verification/auto-harvest-input-audit.json').absolutePath
            }
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file(skeletonWeaponDisplayAudit
                            ? 'build/verification/skeleton-weapon-display-generated'
                            : 'src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            if (project.providers.gradleProperty('miteLivestockHealthAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.livestockHealthAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mite.livestockHealthAuditOutput', file('build/verification/033-client-health-audit.json').absolutePath
            }
            if (project.providers.gradleProperty('miteAppleSkinAudit').getOrElse('false').toBoolean()) {
                systemProperty 'mite.appleSkinAudit', 'true'
                systemProperty 'mixin.debug.export', 'true'
                boolean emptyAuditMods = project.providers.gradleProperty('miteAppleSkinAuditNoMods').getOrElse('false').toBoolean()
                if (emptyAuditMods) gameDirectory = file('build/verification/020-no-appleskin-run')
                systemProperty 'mite.appleSkinAuditOutput', file(emptyAuditMods
                        ? 'build/verification/appleskin-compatibility-audit-absent.json'
                        : 'build/verification/appleskin-compatibility-audit.json').absolutePath
            }
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

dependencies {
    // Optional client integration. JEI is supplied by the player's mods folder, never bundled.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    // Optional native sidebar hook; JEI internals are compile-only and never bundled or required.
    compileOnly('mezz.jei:jei-1.21.1-neoforge:19.57.0.451') { transitive = false }
    // Jade discovers its integration only when installed; its classes are never bundled or required.
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    gametestCompileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
